<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Scene 3 - The Detonation & Blast Zones</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        color: #f8fafc;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .s3-map-bg {
        position: absolute;
        inset: 0;
        background: url('assets/img/jamnagar.jpg') center/cover no-repeat;
        filter: brightness(0.65) contrast(1.25);
        transform: scale(1.05);
      }
      .s3-map-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(15, 23, 42, 0.2) 20%, rgba(9, 13, 22, 0.85) 90%);
      }
      .top-banner {
        position: absolute;
        top: 40px;
        left: 60px;
        right: 60px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        padding-bottom: 16px;
        z-index: 50;
      }
      .brand-title {
        font-family: 'Syne', sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-badge {
        background: #f59e0b;
        color: #090d16;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 4px;
      }
      .engine-status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 700;
        color: #10b981;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.35);
        padding: 6px 14px;
        border-radius: 999px;
      }
      .engine-dot {
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 10px #10b981;
      }
      .s3-epicenter {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 24px;
        height: 24px;
        background: #f59e0b;
        border: 4px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 30px #f59e0b, 0 0 60px #ef4444;
        z-index: 25;
      }
      .blast-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        border-radius: 50%;
        pointer-events: none;
        z-index: 20;
      }
      .ring-1 {
        width: 260px;
        height: 260px;
        border: 3px solid #ef4444;
        background: rgba(239, 68, 68, 0.35);
        box-shadow: 0 0 35px rgba(239, 68, 68, 0.5);
      }
      .ring-2 {
        width: 480px;
        height: 480px;
        border: 2px dashed #f59e0b;
        background: rgba(245, 158, 11, 0.25);
      }
      .ring-3 {
        width: 720px;
        height: 720px;
        border: 2px solid #10b981;
        background: rgba(16, 185, 129, 0.18);
      }
      .ring-4 {
        width: 1000px;
        height: 1000px;
        border: 2px dashed #38bdf8;
        background: rgba(56, 189, 248, 0.12);
      }
      .zone-tag {
        position: absolute;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 8px 16px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        z-index: 28;
      }
      .tag-1 { top: 38%; left: 54%; color: #ef4444; border-left: 4px solid #ef4444; }
      .tag-2 { top: 29%; left: 59%; color: #f59e0b; border-left: 4px solid #f59e0b; }
      .tag-3 { top: 20%; left: 64%; color: #10b981; border-left: 4px solid #10b981; }
      .tag-4 { top: 11%; left: 69%; color: #38bdf8; border-left: 4px solid #38bdf8; }

      .wind-indicator {
        position: absolute;
        bottom: 50px;
        right: 60px;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 16px 24px;
        border-radius: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 700;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 30;
      }
      .compass-arrow {
        color: #f59e0b;
        font-size: 24px;
        transform: rotate(45deg);
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-4cz9" id="root" data-composition-id="scene-3" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <div data-hf-id="hf-wjao" class="s3-map-bg" id="map-bg" data-layout-allow-overflow=""></div>
      <div data-hf-id="hf-lxps" class="s3-map-overlay"></div>

      <header data-hf-id="hf-aauo" class="top-banner">
        <div data-hf-id="hf-5y4q" class="brand-title">
          <span data-hf-id="hf-8rul">THREAT ZONE</span>
          <span data-hf-id="hf-jalm" class="brand-badge">INDIA SAFETY VCE / BLEVE</span>
        </div>
        <div data-hf-id="hf-rz31" class="engine-status">
          <span data-hf-id="hf-amjd" class="engine-dot"></span>
          <span data-hf-id="hf-3ps3">● PHYSICS ENGINE LIVE</span>
        </div>
      </header>

      <div data-hf-id="hf-7hxf" class="s3-epicenter" id="epicenter"></div>

      <div data-hf-id="hf-h07d" class="blast-ring ring-4" id="ring-4"></div>
      <div data-hf-id="hf-oqwp" class="blast-ring ring-3" id="ring-3"></div>
      <div data-hf-id="hf-sk35" class="blast-ring ring-2" id="ring-2"></div>
      <div data-hf-id="hf-nksh" class="blast-ring ring-1" id="ring-1"></div>

      <div data-hf-id="hf-a81d" class="zone-tag tag-1" id="tag-1">ZONE 1 · 280m · FATAL DEMOLITION</div>
      <div data-hf-id="hf-4sdy" class="zone-tag tag-2" id="tag-2">ZONE 2 · 620m · HEAVY EQUIPMENT RUPTURE</div>
      <div data-hf-id="hf-3u2z" class="zone-tag tag-3" id="tag-3">ZONE 3 · 1,140m · THRESHOLD INJURY</div>
      <div data-hf-id="hf-jc9w" class="zone-tag tag-4" id="tag-4">ZONE 4 · 2,450m · SAFE EVACUATION PERIMETER</div>

      <div data-hf-id="hf-x97a" class="wind-indicator" id="wind">
        <span data-hf-id="hf-1wx0" class="compass-arrow">↗</span>
        <div data-hf-id="hf-yeow">
          <div data-hf-id="hf-gewc" style="font-size: 11px; color: #cbd5e1">WIND DISPERSION VECTOR</div>
          <div data-hf-id="hf-px0z">14 km/h · 45° NORTH-EAST</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["scene-3"] = tl;

      // Epicenter detonation at 0.74s (synced to music strong cue 8.74s)
      tl.fromTo(
        "#epicenter",
        { scale: 0, opacity: 0 },
        { scale: 2.2, opacity: 1, duration: 0.25, ease: "power4.out" },
        0.7
      );
      tl.to("#epicenter", { scale: 1, duration: 0.35, ease: "power2.inOut" }, 0.95);

      tl.fromTo(
        "#ring-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" },
        0.74
      );
      tl.fromTo(
        "#ring-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.95
      );
      tl.fromTo(
        "#ring-3",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        1.2
      );
      tl.fromTo(
        "#ring-4",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" },
        1.5
      );

      tl.fromTo("#tag-1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.3);
      tl.fromTo("#tag-2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.6);
      tl.fromTo("#tag-3", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.9);
      tl.fromTo("#tag-4", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 2.2);

      tl.fromTo("#wind", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);

      tl.seek(0);
    </script>
  </body>
</html>
