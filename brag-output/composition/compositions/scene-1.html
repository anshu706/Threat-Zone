<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Scene 1 - The Hook</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #090d16;
        color: #f8fafc;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .hud-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 80px 80px;
        pointer-events: none;
      }
      .top-banner {
        position: absolute;
        top: 40px;
        left: 60px;
        right: 60px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        padding-bottom: 16px;
      }
      .brand-title {
        font-family: 'Syne', sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-badge {
        background: #f59e0b;
        color: #090d16;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 4px;
      }
      .engine-status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 700;
        color: #10b981;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.35);
        padding: 6px 14px;
        border-radius: 999px;
      }
      .engine-dot {
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 10px #10b981;
      }
      .s1-center-box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 1400px;
      }
      .s1-tagline {
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        font-weight: 700;
        color: #f59e0b;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .s1-headline {
        font-family: 'Syne', sans-serif;
        font-size: 68px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #f8fafc;
        margin-bottom: 30px;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      }
      .s1-subhead {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 600;
        color: #cbd5e1;
        letter-spacing: 0.06em;
      }
      .s1-crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 600px;
        height: 600px;
        transform: translate(-50%, -50%);
        border: 1px dashed rgba(245, 158, 11, 0.35);
        border-radius: 50%;
        pointer-events: none;
      }
      .s1-crosshair::before, .s1-crosshair::after {
        content: '';
        position: absolute;
        background: rgba(245, 158, 11, 0.4);
      }
      .s1-crosshair::before {
        top: 50%;
        left: -40px;
        right: -40px;
        height: 1px;
      }
      .s1-crosshair::after {
        left: 50%;
        top: -40px;
        bottom: -40px;
        width: 1px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g5pe" id="root" data-composition-id="scene-1" data-start="0" data-duration="3.2" data-width="1920" data-height="1080">
      <div data-hf-id="hf-o9hg" class="hud-grid"></div>

      <header data-hf-id="hf-aauo" class="top-banner">
        <div data-hf-id="hf-5y4q" class="brand-title">
          <span data-hf-id="hf-8rul">THREAT ZONE</span>
          <span data-hf-id="hf-jalm" class="brand-badge">INDIA SAFETY VCE / BLEVE</span>
        </div>
        <div data-hf-id="hf-rz31" class="engine-status">
          <span data-hf-id="hf-amjd" class="engine-dot"></span>
          <span data-hf-id="hf-3ps3">● PHYSICS ENGINE LIVE</span>
        </div>
      </header>

      <div data-hf-id="hf-1l77" class="s1-crosshair" id="crosshair"></div>

      <div data-hf-id="hf-zzdq" class="s1-center-box">
        <p data-hf-id="hf-dhyc" class="s1-tagline" id="tagline">UNCONTAINED HYDROCARBON RELEASE HAZARD</p>
        <h1 data-hf-id="hf-3hp5" class="s1-headline" id="headline">WHEN 50 TONNES OF HYDROCARBON FLASH...</h1>
        <p data-hf-id="hf-jypx" class="s1-subhead" id="subhead">RELIANCE JAMNAGAR REFINERY · 1.4 MMbpd · GUJARAT</p>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["scene-1"] = tl;

      tl.fromTo(
        "#headline",
        { opacity: 0, y: 36, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#tagline",
        { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.1
      );
      tl.fromTo(
        "#subhead",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.6
      );
      tl.fromTo(
        "#crosshair",
        { scale: 1.4, opacity: 0, rotation: -20 },
        { scale: 1, opacity: 1, rotation: 0, duration: 1.2, ease: "expo.out" },
        0.1
      );

      tl.seek(0);
    </script>
  </body>
</html>
