<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Threat Zone Launch Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #090d16;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-kgqb" id="root" data-composition-id="main" data-start="0" data-duration="19.5" data-width="1920" data-height="1080">
      <!-- Audio Tracks -->
      <audio data-hf-id="hf-ao5m" id="bg-music" data-start="0" data-duration="19.5" data-track-index="10" data-volume="0.38" src="assets/music/track.mp3"></audio>
      <audio data-hf-id="hf-vrph" id="sfx-toggle" data-start="3.6" data-duration="0.16" data-track-index="11" data-volume="0.65" src="assets/sfx/click.ogg"></audio>
      <audio data-hf-id="hf-cva8" id="sfx-blast" data-start="8.7" data-duration="0.49" data-track-index="12" data-volume="0.85" src="assets/sfx/impact.ogg"></audio>
      <audio data-hf-id="hf-xej5" id="sfx-alert" data-start="13.5" data-duration="0.30" data-track-index="13" data-volume="0.70" src="assets/sfx/alert.ogg"></audio>

      <!-- Sub-Compositions with stable IDs -->
      <div data-hf-id="hf-9cg0" id="scene-1-clip" class="clip" data-composition-id="scene-1" data-composition-src="compositions/scene-1.html" data-start="0" data-duration="3.2" data-track-index="0"></div>
      <div data-hf-id="hf-2ujx" id="scene-2-clip" class="clip" data-composition-id="scene-2" data-composition-src="compositions/scene-2.html" data-start="3.2" data-duration="4.8" data-track-index="0"></div>
      <div data-hf-id="hf-v8ct" id="scene-3-clip" class="clip" data-composition-id="scene-3" data-composition-src="compositions/scene-3.html" data-start="8.0" data-duration="5.5" data-track-index="0"></div>
      <div data-hf-id="hf-x20e" id="scene-4-clip" class="clip" data-composition-id="scene-4" data-composition-src="compositions/scene-4.html" data-start="13.5" data-duration="3.0" data-track-index="0"></div>
      <div data-hf-id="hf-qfpm" id="scene-5-clip" class="clip" data-composition-id="scene-5" data-composition-src="compositions/scene-5.html" data-start="16.5" data-duration="3.0" data-track-index="0"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
